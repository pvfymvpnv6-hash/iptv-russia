name: Liste aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich ca. 06:17 Uhr deutscher Zeit
  workflow_dispatch:       # manuell über den Actions-Tab startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: iptv-org-Quellen holen
        uses: actions/checkout@v4
        with:
          repository: iptv-org/iptv
          path: iptv
          sparse-checkout: streams

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Liste bauen
        run: python build.py iptv/streams russia.m3u

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russia.m3u
          git diff --cached --quiet || git commit -m "Liste aktualisiert ($(date -u +%Y-%m-%d))"
          git push
